# One arm of the controlled comparison. Every field here is part of the commitment hash.
arm: refine            # frozen | refine | bestofn
split: cn-2018-2023    # harness.splits name
universe: csi300
transfer_to: [csi500]  # universes the frozen artifact is scored on, never seen by the loop
seeds: [0, 1, 2, 3, 4]
generator:
  provider: api
  model: "<frontier model id>"
  revision: "<pinned>"
  temperature: 0.7
  max_output_tokens: 4096
control_generator:
  provider: local
  model: pit-4b-ft-201912   # data/models.py name; effective cutoff from harness/cutoff_probe.py
budget:
  max_steps: 20            # refinement steps for the refine arm
  n_candidates: 20         # best-of-N for the bestofn arm; matched to max_steps so compute is equal
  tokens_per_arm: 2000000
verifier:
  metric: ic               # rank IC on the feedback window
  window_days: 1000        # shorten to raise verifier noise in the sweep
stopping:
  rule: none               # none | fixed_k | vrr_stop | pace | optimal_stopping | ours
