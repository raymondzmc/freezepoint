# One arm of the controlled comparison. Every field here is part of the commitment hash.
arm: refine            # frozen | refine | bestofn
split: cn-2018-2023    # harness.splits name
universe: csi300
transfer_to: [csi500, sp500]  # universes the frozen artifact is scored on, never seen by the loop
seeds: [0, 1, 2, 3, 4]
generator:
  provider: api
  model: claude-fable-5-2
  revision: claude-fable-5-2  # complete as written (ids take no date suffix); each trial records the model served
  temperature: null    # the Messages API no longer accepts sampling parameters, so the API samples at its default
  max_output_tokens: 16000  # thinking is always on and counts against it; a reply cut off here stops the run
  effort: null         # null sends no effort parameter, so the API's default effort applies (recorded as api-default)
control_generator:
  provider: local
  model: pit-4b-ft-201912   # data/models.py name; effective cutoff from harness/cutoff_probe.py
budget:
  max_steps: 20            # refinement steps for the refine arm
  n_candidates: 21         # best-of-N for the bestofn arm; max_steps + 1, so compute is equal
  tokens_per_arm: 2000000
verifier:
  metric: ic               # rank IC on the feedback window
  window_days: 1000        # the noise sweep's knob, for a later plan; this plan scores the whole feedback window
stopping:
  rule: none               # none | fixed_k | vrr_stop | pace | optimal_stopping | ours
