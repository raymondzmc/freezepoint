[project]
name = "freezepoint"
version = "0.0.1"
description = "A stopping rule for refinement loops under noisy verifiers, and the contamination-proof harness it runs on"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyqlib>=0.9.6",
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyyaml>=6",
    "huggingface_hub>=0.25",
    "pyarrow>=16",
    "tqdm>=4.66",
    "requests>=2.32",
]

[project.optional-dependencies]
models = ["torch>=2.4", "transformers>=4.45", "accelerate>=0.34"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
